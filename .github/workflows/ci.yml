name: CI Workflow
on:
  push:
    branches:
      - main
    paths-ignore:
        - 'monitoring/**'
        - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'monitoring/**'
      - 'README.md'
  workflow_dispatch: 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup python 
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependecies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  eval-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'   # only runs when YOU manually trigger it
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run evaluation
        run: python -m evals.run_eval --profile dense
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rag-app:latest
