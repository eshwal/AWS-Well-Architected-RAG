- id: test-010
  question: How to secure hybrid network connectivity between AWS and on-premises environments over the internet?
  intent: rag
  query_type: semantic_paraphrase
  golden_sources:
  - lenses/hybrid-networking/HNSEC05.md
  ground_truth: For hybrid network connectivity over the internet, AWS recommends
    using IPSec VPN to create encrypted tunnels between cloud and on-premises environments.
    This ensures all data transmitted is encrypted and protected from unauthorized
    access. Implementation involves establishing IPSec VPN tunnels (e.g., AWS Site-to-Site
    VPN), configuring strong encryption and authentication for endpoints, monitoring
    tunnel health, and restricting routable subnets to approved ranges. Benefits include
    encryption for data in transit, reduced risk of interception or tampering, compliance
    support, and secure hybrid networking without dedicated links. The risk of not
    following this practice is classified as high.
  demonstrates_feature: baseline
  notes: Demonstrates how normal user query is semantically searched
- id: test-011
