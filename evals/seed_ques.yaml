- id: test-019
  question: I'm building an ML model. Should I care more about accuracy or business KPIs?
  intent: rag
  query_type: multi-hop
  golden_sources:
    - lenses/machine-learning/MLPERF01.md
    - lenses/machine-learning/MLPERF02.md
  ground_truth: >
    Start with business KPIs, not model accuracy. First define what success means for the business—for example reducing customer churn by 10%, cutting processing time by 40%, or saving 200 hours of manual work each month. Then choose evaluation metrics that support those goals.
    For instance, if you're building a fraud detection model, missing fraud (false negatives) may cost much more than investigating legitimate transactions (false positives), so recall might matter more than accuracy. Also define acceptable error thresholds before deployment and monitor those metrics continuously in production to detect model drift.
  demonstrates_feature: baseline
  notes: Demonstrates how normal user query is semantically searched across multiple docs 

- id: test-020
  question: What should I consider when deploying a production-ready generative AI application for financial services on AWS?
  intent: rag
  query_type: multi-hop
  golden_sources:
    - lenses/financial-services/FSIOPS02.md
    - lenses/financial-services/FSICOST09.md
    - lenses/generative-ai/GENPERF02.md
  ground_truth: >
    Build a secure, compliant, and high-performing solution by understanding AWS's Shared Responsibility Model, 
    establishing cloud risk and prompt governance, and protecting sensitive data with appropriate privacy controls. 
    Define data retention policies and automate lifecycle transitions to cost-effective storage tiers for long-term compliance. 
    Finally, select the right foundation model, optimize inference parameters, and load test endpoints to validate response quality, latency, and scalability before production.
  demonstrates_feature: baseline
  notes: Demonstrates how normal user query is semantically searched across multiple docs
- id: test-021
  question: How should I build a responsible AI monitoring and continuous improvement process on AWS?
  intent: rag
  query_type: multi-hop
  golden_sources:
    - lenses/responsible-ai/RAIMON01.md
    - lenses/responsible-ai/RAIMON02.md
    - lenses/responsible-ai/RAIMON03.md
  ground_truth: >
    Create monitoring with user consent, privacy controls, drift detection, dashboards, and human review workflows. 
    Use monitoring insights to trigger retraining, guardrail updates, and other improvements through regular review 
    cycles and automated pipelines. When changes affect datasets or AI systems, honor stakeholder obligations by managing 
    dataset retention, notifying downstream consumers, and following documented decommissioning processes.
  demonstrates_feature: baseline
  notes: Demonstrates how normal user query is semantically searched across multiple docs


