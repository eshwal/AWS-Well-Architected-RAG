- id: test-014
  question: How does IAST improve security testing accuracy compared to SAST and DAST?
  intent: rag
  query_type: exact_keyword
  golden_sources:
  - lenses/devops-guidance/QAST08.md
  ground_truth: Interactive Application Security Testing (IAST) improves security
    testing accuracy by combining the strengths of Static Application Security Testing
    (SAST) and Dynamic Application Security Testing (DAST) through an inside-out approach.
    Unlike SAST, which examines source code, or DAST, which inspects a running system,
    IAST uses embedded agents with access to application code, system memory, stack
    traces, and requests/responses to monitor system behavior during runtime. This
    real-time observability provides contextual understanding, significantly reducing
    false positive rates. When vulnerabilities are detected, IAST offers deeper insights
    into their impact, delivering proof that flagged vulnerabilities are genuine and
    actionable. The agents are included during the build process for active monitoring
    in testing environments but should be turned off or set to passive mode in production
    to avoid performance overhead.
  demonstrates_feature: sparse
  notes: Sparse should work here

