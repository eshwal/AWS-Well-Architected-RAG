  intent: rag
  query_type: semantic_paraphrase
  golden_sources:
  - lenses/financial-services/FSISUS12.md
  ground_truth: To track progress toward instance utilization goals for sustainability,
    AWS provides the AWS Customer Carbon Footprint Tool, which reports on emissions
    from AWS usage (including Amazon EC2) following Greenhouse Gas (GHG) Protocol
    standards. This tool allows you to analyze changes in emissions over time and
    forecast emissions across your sustainability journey. Additionally, Amazon CloudWatch
